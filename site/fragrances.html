<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragrances — Feminista</title>
<meta name="description" content="Locken, Vers, Fresca and The Discovery Set. Fragrances by Feminista, each matured for nearly 180 days.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=7"><link rel="stylesheet" href="pages.css?v=20">
<link rel="stylesheet" href="luxe.css?v=4">
</head>
<body data-page="fragrances">
<main class="wrap">
  <p class="crumb"><a href="index.html">Home</a> / Fragrances</p>
  <header class="page-hero center reveal">
    <p class="eyebrow">The collection</p>
    <h1 class="h1">Find your essence</h1>
    <p class="lede">Each fragrance is a chapter. Explore our collection and discover the one that feels like you.</p>
  </header>
  <div id="list"></div>
</main>
<script src="site.js?v=9"></script>
<script>
  document.getElementById('list').innerHTML = ORDER.map((k) => { const p = PRODUCTS[k]; return `
    <article class="list-row reveal">
      <a class="card-img" href="product.html?p=${k}"><img src="${p.list}" alt="${p.name}" loading="lazy"></a>
      <div>
        <p class="eyebrow">${p.tag}</p><h2 class="h1">${p.name}</h2><p class="tl">${p.tagline}</p><p class="lede">${p.short}</p>
        <p class="price">${p.was ? `<s>${inr(p.was)}</s>` : ''}${inr(p.price)} <span style="font:400 13px var(--sans);color:var(--muted)">· ${p.size}</span></p>
        <div class="sc-act" style="margin-top:0"><button class="btn" data-add="${k}">Add to cart</button><a class="link" href="product.html?p=${k}">Discover ${p.name} <span>→</span></a></div>
      </div>
    </article>`; }).join('');
  watchReveals();
</script>
</body>
</html>
